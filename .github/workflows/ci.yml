name: CI

# Build every target and run the native unit suite on each change, so a broken
# compile or a failing test is caught automatically. See slices/0010.
on:
  push:
  pull_request:

# Only the latest push to a given ref is worth building; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: native
            cmd: pio test -e native
          - env: cardputer
            cmd: pio run -e cardputer
          - env: m5stick
            cmd: pio run -e m5stick
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The pioarduino ESP32 platform requires Python 3.10-3.13; '3.x' resolves
          # to 3.14 on current runners and the platform hard-rejects it.
          python-version: '3.13'

      # The pioarduino platform, the bruce Arduino-libs bundle and the Xtensa
      # toolchain are large release-zip downloads; cache them per leg. Keyed on
      # platformio.ini so the cache invalidates when platform/lib/env defs change.
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: ${{ matrix.cmd }}
        # Tee to a log the size step parses. GitHub's bash runs with pipefail, so a
        # failing pio still fails this step through the tee.
        run: ${{ matrix.cmd }} 2>&1 | tee build.log

      # Surface RAM/Flash per firmware target so growth toward the partition ceiling is
      # visible on every run — the m5stick uses huge_app (3 MB, no OTA), where a full
      # partition is a hard build failure, not a degraded update. Report-only for now; a
      # deliberate ceiling gate follows once the trend is measured. See slices/0039.
      - name: Build size
        if: matrix.env != 'native'
        shell: bash
        run: |
          flash_line=$(grep -E '^Flash:' build.log | tail -1 || true)
          if [ -z "$flash_line" ]; then
            echo "::error::No 'Flash:' line in the build output — PlatformIO's size format may have changed; the CI size report is broken."
            exit 1
          fi
          {
            echo "### Build size — ${{ matrix.env }}"
            echo ""
            echo "| Memory | Used | Capacity | Usage | Headroom |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            for metric in RAM Flash; do
              line=$(grep -E "^${metric}:" build.log | tail -1 || true)
              if [ -z "$line" ]; then
                echo "::warning::No '${metric}:' line in the build output for ${{ matrix.env }}."
                continue
              fi
              used=$(sed -E 's/.*used ([0-9]+) bytes from ([0-9]+) bytes.*/\1/' <<<"$line")
              total=$(sed -E 's/.*used ([0-9]+) bytes from ([0-9]+) bytes.*/\2/' <<<"$line")
              pct=$(sed -E 's/.*\][[:space:]]*([0-9.]+)%.*/\1/' <<<"$line")
              printf '| %s | %d B (%d KB) | %d B (%d KB) | %s%% | %d B (%d KB) |\n' \
                "$metric" "$used" "$((used / 1024))" "$total" "$((total / 1024))" \
                "$pct" "$((total - used))" "$(((total - used) / 1024))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # cppcheck is a separate job, not a matrix leg: it needs an apt install and
  # different steps, which would contort the env->cmd matrix above. It gates on
  # cppcheck's default `error` severity — genuine bugs (null deref, buffer
  # overrun, use-after-free), the low-false-positive class — over our own src/
  # only (lib/ is vendored). Broader warning/style triage is tracked in the
  # ledger. False positives are handled with in-source `cppcheck-suppress`
  # comments, not by loosening the gate. See slices/0011.
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: >
          cppcheck --std=c++17 --language=c++ --error-exitcode=1
          --inline-suppr --suppress=missingIncludeSystem
          -I src src/

  # Source lint for a doubled-backslash escape ("...\\n") that emits two characters
  # instead of a newline and smears serial logs into run-on records. A source-level
  # guard, not a mock-Serial test (which would assert a log string — fragile). Lives
  # here beside cppcheck, not in the Stele pre-commit hook, which is scoped to the
  # documentation method and never archives src/. See slices/0037.
  serial-escapes:
    name: serial-escapes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-test the lint
        run: node --test scripts/lint-serial-escapes.test.mjs

      - name: Lint src for literal escapes
        run: node scripts/lint-serial-escapes.mjs src
