name: Pages

# Publish the web flasher (web/) to GitHub Pages. The firmware is served
# SAME-ORIGIN with the page: GitHub release assets send no CORS headers, so the
# browser cannot fetch them cross-origin from Pages ("Failed to fetch"). Each
# deploy pulls the latest release's factory image into the site and the manifest
# points at a relative path. Hence the release trigger too — a new firmware
# release must refresh the binary the page serves. See slices/0016.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

# Least privilege for the Pages deployment: read the repo, write the Pages site,
# and mint the OIDC token deploy-pages exchanges. No third-party actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deploys race; let an in-flight one finish (don't cancel a
# publish midway).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pull the latest release's factory image into the site so the manifest can
      # reference it same-origin (see the header note on CORS). Not committed to
      # git — assembled at deploy time. Fails loud if the asset is missing, rather
      # than shipping a flasher whose Install button 404s.
      - name: Fetch latest factory image into the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern adversary-cardputer-factory.bin \
            --dir web
          ls -la web/adversary-cardputer-factory.bin

      - uses: actions/configure-pages@v5

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
