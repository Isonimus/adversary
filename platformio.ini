; PlatformIO Configuration for The Adversary
; Red-team wireless pentesting tool for M5Stack devices

[platformio]
default_envs = cardputer
src_dir = src
test_dir = test
lib_dir = lib
data_dir = data

; ========================================
; Common settings for embedded targets
; ========================================
[env_embedded]
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Pre-action: keep ieee80211_raw_frame_sanity_check weak so deauth.cpp's
; override links (see scripts/weaken_deauth_pre.py). Runs on every embedded build.
extra_scripts = pre:scripts/weaken_deauth_pre.py
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    -Wextra
lib_deps = 
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^1.4.1
    kkloesener/MFRC522_I2C@^1.0
    crankyoldgit/IRremoteESP8266@^2.8.6
test_framework = unity
test_build_src = yes

; ========================================
; M5Stack Cardputer (ESP32-S3)
; ========================================
[env:cardputer]
extends = env_embedded
; Use pioarduino platform which has patched ESP-IDF libs allowing deauth frame TX
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
; Use Bruce's patched ESP32 Arduino libs with weak ieee80211_raw_frame_sanity_check symbol
platform_packages = 
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
board = m5stack-stamps3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
; No memory_type override: the StampS3 (original Cardputer) and the Cardputer ADV
; both have NO PSRAM chip. Without an override the board default resolves to
; qio_qspi (QIO flash, quad-PSRAM libs); the quad probe fails quietly on a
; chip-less board and boot continues on internal SRAM. Do NOT set qio_opi — it
; forces octal-PSRAM boot init that fails loudly ("octal_psram: wrong line mode")
; on a board with no PSRAM. See slices/0008. QIO flash is set below regardless.
board_build.flash_mode = qio
build_flags = 
    ${env_embedded.build_flags}
    -DTARGET_CARDPUTER=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_ESP32S3_DEV=1
    ; SD card SPI pins configured via SPIClass.begin() instead of defines
    ; to avoid conflicts with pins_arduino.h in pioarduino platform
    ; NOTE: Do not re-add -DMBEDTLS_SSL_*_CONTENT_LEN here. mbedTLS ships
    ; precompiled in framework-arduinoespressif32-libs, so these defines never
    ; reach the library — measured TLS cost stays ~62KB (16KB IN+OUT record
    ; buffers), i.e. the flags were inert. Heap headroom for uploads comes from
    ; the canvas purge in SystemManager::prepareForMemoryIntensiveTask(), with
    ; tls_upload::streamFile() pacing as the safety net.
build_unflags =
    -Werror=all
lib_deps = 
    ${env_embedded.lib_deps}
    m5stack/M5Cardputer@^1.0.0
    fastled/FastLED@^3.6.0

; ========================================
; M5StickC Plus2 (ESP32-PICO-V3-02)
; ========================================
[env:m5stick]
extends = env_embedded
; Use pioarduino platform which has patched ESP-IDF libs allowing deauth frame TX
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
; Use Bruce's patched ESP32 Arduino libs with weak ieee80211_raw_frame_sanity_check symbol
platform_packages = 
    framework-arduinoespressif32-libs @ https://github.com/bmorcelli/esp32-arduino-lib-builder/releases/download/idf-release_v5.5/bruce_esp32-arduino-libs-20251205-131242.zip
board = esp32-pico-devkitm-2
; Use huge_app partition (3MB app, no OTA) to fit larger firmware
board_build.partitions = huge_app.csv
build_flags = 
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -Wall
    -Wextra
    -DTARGET_M5STICK=1
    ; Disable USB CDC (ESP32 PICO doesn't have USB OTG)
    -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags = 
    -Werror=all
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    ${env_embedded.lib_deps}
    m5stack/M5StickCPlus2@^1.0.0
    fastled/FastLED@^3.6.0

; ========================================
; Native environment for unit tests
; ========================================
[env:native]
platform = native
build_flags = 
    -std=c++17
    -DUNIT_TEST=1
    -DNATIVE_BUILD=1
    -DUNITY_INCLUDE_DOUBLE
    -I test/common
    -g
    -O0
build_src_filter =
    +<core/>
    +<utils/>
    +<modules/ap/>
    +<modules/network/>
    +<modules/storage/>
    +<modules/wifi/wifi_connection.cpp>
    +<modules/wifi/wifi_scanner.cpp>
    +<modules/wifi/station_scanner.cpp>
    +<modules/attack/evil_twin.cpp>
    +<modules/attack/karma_ap.cpp>
    +<modules/gps/>
    +<modules/wardriving/>
    +<modules/ble/ble_crypto.cpp>
    +<modules/rf/ook_signal.cpp>
    +<modules/rf/spectrum_scan.cpp>
    +<modules/ir/>
    +<modules/rfid/>
    +<modules/notification/notification_manager.cpp>
    +<modules/system/time_manager.cpp>
    +<hal/storage/sd_manager.cpp>
    +<../test/common/*.cpp>
    -<../test/common/notification_mocks.cpp>
    -<main.cpp>
    -<hal/>
    +<hal/storage/sd_manager.cpp>
    -<ui/>
    ; Pure pulse-strip downsampler is display-free (slice-0005); its renderer is
    ; device-guarded, so this compiles clean natively for test_pulse_strip.
    +<ui/components/pulse_strip.cpp>
test_build_src = yes
lib_deps = 
    throwtheswitch/Unity@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
test_ignore = test_embedded_*

