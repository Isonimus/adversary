<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adversary - Authentication Required</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0c0c0c;
            color: #e0e0e0;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: #ff3e3e;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        p {
            color: #888;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background: #ff3e3e;
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🔐</div>
        <div class="logo">ADVERSARY</div>
        <h1>Authentication Required</h1>
        <p>This dashboard is protected. Please authenticate to continue.</p>
        <a href="/" class="btn">Sign In</a>
    </div>
</body>

</html>
